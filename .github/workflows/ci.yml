name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff format --check . && uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Check architecture
        run: uv run python scripts/check_architecture.py
      - name: Test with coverage
        run: uv run pytest --cov=femx --cov-branch --cov-report=term-missing -m "not contract"
      - name: Build distributions
        run: uv build

  compatibility:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Run fast portable tests
        run: uv run pytest -m "unit or architecture"
