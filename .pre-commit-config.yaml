repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: femx-architecture
        name: femx architecture boundaries
        entry: uv run python scripts/check_architecture.py
        language: system
        pass_filenames: false
